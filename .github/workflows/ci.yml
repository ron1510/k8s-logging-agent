name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go test ./...
          cd tests
          go test ./...

      - name: Perf smoke
        run: |
          OUTPUT=$(go run ./cmd/perf-runner --scenarios small --timeout 20s --repeat 1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q '^small,1,ok,'

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint deploy/helm/k8s-logging-agent
