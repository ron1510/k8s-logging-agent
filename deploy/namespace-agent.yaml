apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-log-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-log-agent
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-log-agent
  namespace: default
subjects:
  - kind: ServiceAccount
    name: k8s-log-agent
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-log-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-log-agent
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-log-agent
  template:
    metadata:
      labels:
        app: k8s-log-agent
    spec:
      serviceAccountName: k8s-log-agent
      containers:
        - name: agent
          image: your-registry/k8s-log-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LABEL_SELECTOR
              value: "monitor-logs=true"
            - name: MAX_CONCURRENT_STREAMS
              value: "200"
            - name: QUEUE_SIZE
              value: "10000"
            - name: BATCH_SIZE
              value: "512"
            - name: BATCH_TIMEOUT
              value: "5s"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
