apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: default
data:
  config.yaml: |
    receivers:
      filelog:
        include:
          - /var/log/agent/*.log
        start_at: end
        include_file_path: true
        include_file_name: true
    exporters:
      otlp:
        endpoint: your-upstream-collector:4317
        tls:
          insecure: true
    service:
      pipelines:
        logs:
          receivers: [filelog]
          exporters: [otlp]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-log-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-log-agent
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-log-agent
  namespace: default
subjects:
  - kind: ServiceAccount
    name: k8s-log-agent
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-log-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-log-agent
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-log-agent
  template:
    metadata:
      labels:
        app: k8s-log-agent
    spec:
      serviceAccountName: k8s-log-agent
      volumes:
        - name: agent-logs
          emptyDir: {}
        - name: otel-config
          configMap:
            name: otel-collector-config
      containers:
        - name: agent
          image: your-registry/k8s-log-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LABEL_SELECTOR
              value: "monitor-logs=true"
          volumeMounts:
            - name: agent-logs
              mountPath: /var/log/agent
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:latest
          args: ["--config=/etc/otel/config.yaml"]
          volumeMounts:
            - name: agent-logs
              mountPath: /var/log/agent
            - name: otel-config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
