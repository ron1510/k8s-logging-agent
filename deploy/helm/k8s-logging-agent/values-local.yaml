image:
  repository: k8s-logging-agent
  tag: dev
  pullPolicy: IfNotPresent

collector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.145.0"
    pullPolicy: IfNotPresent
  parseJsonLogs: true
  config: |-
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      filelog:
        include:
          - {{ .Values.sharedVolume.mountPath }}/agent.log
        start_at: end
        include_file_path: true
        include_file_name: true
        operators:
          - type: regex_parser
            regex: '^AGENT_FORWARD ts=(?P<ts>[^ ]+) ns=(?P<ns>[^ ]+) pod=(?P<pod>[^ ]+) container=(?P<container>[^ ]+) workload=(?P<workload>[^ ]+) msg=(?P<msg>.*)$'
            parse_from: body
            on_error: drop
            timestamp:
              parse_from: attributes.ts
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z07:00'
          - type: move
            from: attributes.msg
            to: body
          - type: json_parser
            parse_from: body
            parse_to: body
            if: 'body matches "^\\s*[\\{\\[]"'
            on_error: send
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
    exporters:
      debug:
        verbosity: detailed
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, batch]
          exporters: [debug]

pdb:
  enabled: false
