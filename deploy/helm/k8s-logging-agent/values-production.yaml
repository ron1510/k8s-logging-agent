image:
  repository: ghcr.io/your-org/k8s-logging-agent
  tag: "v0.1.0"
  pullPolicy: IfNotPresent

collector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.145.0"
    pullPolicy: IfNotPresent
  otlpEndpoint: otel-gateway.observability.svc.cluster.local:4317
  config: |-
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      filelog:
        include:
          - {{ .Values.sharedVolume.mountPath }}/agent.log
        start_at: end
        include_file_path: true
        include_file_name: true
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
    exporters:
      otlp:
        endpoint: {{ .Values.collector.otlpEndpoint }}
        tls:
          insecure: false
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, batch]
          exporters: [otlp]

env:
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: LABEL_SELECTOR
    value: "monitor-logs=true"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

collectorResources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

pdb:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
