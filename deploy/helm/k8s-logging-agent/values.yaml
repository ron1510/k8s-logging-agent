replicaCount: 1

image:
  repository: your-registry/k8s-logging-agent
  tag: "v0.1.0"
  pullPolicy: IfNotPresent

collector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.145.0"
    pullPolicy: IfNotPresent
  otlpEndpoint: your-upstream-collector.default.svc.cluster.local:4317
  config: |-
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      filelog:
        include:
          - {{ .Values.sharedVolume.mountPath }}/agent.log
        start_at: end
        include_file_path: true
        include_file_name: true
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
    exporters:
      otlp:
        endpoint: {{ .Values.collector.otlpEndpoint }}
        tls:
          insecure: false
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, batch]
          exporters: [otlp]

sharedVolume:
  name: agent-logs
  mountPath: /var/log/agent
  sizeLimit: 1Gi

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

collectorSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

collectorResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: LABEL_SELECTOR
    value: "monitor-logs=true"
extraEnv: []

livenessProbe: {}
readinessProbe: {}
startupProbe: {}

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

priorityClassName: ""
terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3
minReadySeconds: 5

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
